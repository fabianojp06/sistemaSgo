name: Supabase Migrate

on:
  workflow_dispatch:
    inputs:
      usuario_id_remover:
        description: 'Id de Usuario para checar/remover como órfão (deixe vazio para pular)'
        required: false
      confirmar_remocao:
        description: 'true para efetivamente remover; false roda só em modo leitura'
        required: false
        default: 'false'
      limpar_plano_contas_tenant:
        description: 'tenantId para checar/limpar ContaContabil (deixe vazio para pular)'
        required: false
      confirmar_limpeza_plano_contas:
        description: 'true para efetivamente apagar o plano de contas do tenant; false roda só em modo leitura'
        required: false
        default: 'false'

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      # 2026-09-21: renomeadas para os nomes que o datasource do schema.prisma
      # passou a ler em 2026-08-27 (PR #13, troca de DATABASE_URL pelo par da
      # integração Supabase↔Vercel). Com os nomes antigos, `prisma migrate
      # deploy` e o seed falhavam em "Environment variable not found:
      # POSTGRES_PRISMA_URL" — por isso a última execução verde deste workflow
      # é de 2026-08-03. São os MESMOS secrets, apontando para o MESMO banco:
      # só o nome da variável muda. DATABASE_URL/DIRECT_URL seguem exportadas
      # para os scripts avulsos (remover-usuario-orfao, limpar-plano-contas),
      # que criam o PrismaClient pelo mesmo schema.
      #
      # 2026-09-22: TODAS as quatro apontam para SUPABASE_DIRECT_URL, que hoje
      # guarda a string do Session pooler (aws-0-*.pooler.supabase.com:5432).
      # Motivo: SUPABASE_DATABASE_URL ainda guarda a Direct connection
      # (db.<ref>.supabase.co:5432), que o Supabase só publica em IPv6 —
      # runners do GitHub Actions são IPv4-only e batem em P1001 ("Can't reach
      # database server"). Foi exatamente assim que o seed falhou no run #35,
      # no mesmo job em que o `migrate deploy` passou pelo pooler.
      # Este workflow é pontual (uma migration + um seed por vez), então não
      # ganha nada com pool de conexões: a sessão do pooler serve aos dois.
      # Trocar SUPABASE_DATABASE_URL pela string do pooler também resolveria —
      # se isso for feito um dia, dá para voltar a separar as variáveis aqui.
      POSTGRES_PRISMA_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
      POSTGRES_URL_NON_POOLING: ${{ secrets.SUPABASE_DIRECT_URL }}
      DATABASE_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
      DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npx prisma migrate status
        continue-on-error: true
      - run: npx prisma migrate deploy
      - run: npx prisma db execute --schema prisma/schema.prisma --stdin <<< "select 1;"
      - run: node prisma/seed.mjs
      - if: ${{ github.event.inputs.usuario_id_remover != '' }}
        run: node scripts/remover-usuario-orfao.mjs
        env:
          USUARIO_ID: ${{ github.event.inputs.usuario_id_remover }}
          CONFIRMAR: ${{ github.event.inputs.confirmar_remocao }}
      - if: ${{ github.event.inputs.limpar_plano_contas_tenant != '' }}
        run: node scripts/limpar-plano-contas.mjs
        env:
          TENANT_ID: ${{ github.event.inputs.limpar_plano_contas_tenant }}
          CONFIRMAR: ${{ github.event.inputs.confirmar_limpeza_plano_contas }}
